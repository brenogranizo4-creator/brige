function catOrder(){const seen=[];plist().sort((a,b)=>a.id-b.id).forEach(p=>{if(p.category&&!seen.includes(p.category))seen.push(p.category)});return seen}
function byCat(arr){const order=catOrder();const g={};arr.forEach(p=>{(g[p.category||"Sem categoria"]=g[p.category||"Sem categoria"]||[]).push(p)});return Object.keys(g).sort((a,b)=>(order.indexOf(a)+1||99)-(order.indexOf(b)+1||99)).map(k=>[k,g[k].sort((a,b)=>a.id-b.id)])}
function summarize(sales){let rev=0,cost=0,units=0;const per={};sales.forEach(s=>{const r=s.qty*s.unitPrice,c=s.qty*(s.unitCost||0);rev+=r;cost+=c;units+=s.qty;const k=s.productId;per[k]=per[k]||{id:k,name:s.name,qty:0,rev:0,cost:0};per[k].qty+=s.qty;per[k].rev+=r;per[k].cost+=c});const rows=Object.values(per).sort((a,b)=>b.rev-a.rev);return{rev,cost,profit:rev-cost,units,margin:rev>0?(rev-cost)/rev:0,rows,count:sales.length}}
function soldToday(pid){return S.todaySales.filter(s=>s.productId===pid).reduce((a,s)=>a+s.qty,0)}
function stockState(p){if(p.stockQty==null)return null;const min=p.minStockQty??(S.settings.lowStockThreshold??3);if(p.stockQty<=0)return"bad";if(p.stockQty<=min)return"warn";return"ok"}
function lowStock(){return plist().filter(p=>p.active!==false&&(stockState(p)==="warn"||stockState(p)==="bad"))}
function imgTag(p,cls){return p.imageUrl?`<img class="${cls||""}" src="${esc(p.imageUrl)}" alt="" loading="lazy">`:""}
function thumb(p){return p.imageUrl?`<img class="thumb" src="${esc(p.imageUrl)}" alt="" loading="lazy">`:`<div class="thumb" aria-hidden="true">${initial(p.name)}</div>`}

/* ---------- render shell ---------- */
function renderTabs(){const v=view();$("#tabs").innerHTML=VIEWS.map(([k,l,ic])=>`<a href="#${k}" ${k===v?'aria-current="page"':""}><svg viewBox="0 0 24 24" aria-hidden="true">${ic}</svg>${l}</a>`).join("")}
function render(){
  renderTabs();
  $("#storeName").textContent=S.settings.storeName||"Brigé";
  const v=view();const app=$("#app");
  if(S.user===null){renderLogin();$("#cartbar").hidden=true;return}
  if(!S.user){app.innerHTML=`<div class="empty"><b>Abrindo o sistema</b>Conectando…</div>`;return}
  if(!S.loaded){app.innerHTML=`<div class="empty"><b>Abrindo o sistema</b>Buscando produtos, cardápio e vendas.</div>`;return}
  const ro=S.canWrite?"":`<div class="banner warn">Você está vendo em modo leitura. Peça ao responsável técnico para liberar seu acesso.</div>`;
  app.innerHTML=ro+(R[v]||R.painel)();const w=$("#whoami");if(w&&S.user)w.textContent=S.user.email;
  renderCart();
  if(v==="cardapio")ensureMenuLoaded();
  if(v==="fechamento")ensurePeriod();
}

/* ---------- COMANDA (PDV) ---------- */
const nextNo=()=>Math.max(0,...S.todayOrders.map(o=>o.number||0))+1;
function orderCard(o,actions){const c=CH[o.channel]||CH.balcao;const confirm=S.confirmSale===o.oid;
  return `<div class="order ${o.channel==="ifood"?"app-i":o.channel==="n99"?"app-9":""}"><div class="hd"><span class="no num">#${o.number}</span><span class="pill ${c.cls}">${c.label}</span><span class="pill neutral">${esc(PAY[o.payment]||o.payment)}</span><span class="muted num">${hm(o.ts)}</span><span style="flex:1"></span><b class="num">${brl(o.total)}</b></div>
  <div class="it">${(o.items||[]).map(i=>i.qty+"× "+esc(i.name)).join(" · ")}</div>${o.note?`<div class="it">Obs.: ${esc(o.note)}</div>`:""}
  ${actions&&S.canWrite?`<div class="row" style="justify-content:flex-end">${confirm?`<span class="muted" style="font-size:13px">Cancelar esta comanda?</span><button class="btn small danger" data-act="delsale" data-id="${o.oid}">Sim, cancelar</button><button class="btn small" data-act="nodel">Não</button>`:`<button class="btn small" data-act="askdel" data-id="${o.oid}">Cancelar comanda</button>`}</div>`:""}</div>`}
R.pdv=()=>{
  const ids=S.todayMenu.filter(id=>S.products[id]&&S.products[id].active!==false);const ch=S.channel;
  let html=`<div class="view-head"><div><div class="eyebrow">${esc(longDate(S.T))}</div><h2>Comanda <span class="num">#${nextNo()}</span></h2></div></div>
  <div class="chbar" role="group" aria-label="Tipo de venda">${Object.entries(CH).map(([k,c])=>`<button class="chbtn ${c.cls} ${ch===k?"on":""}" data-act="chan" data-k="${k}">${c.label}</button>`).join("")}</div>`;
  if(ch!=="balcao")html+=`<div class="banner info">Venda pelo ${CH[ch].label}: os preços abaixo são os do aplicativo.</div>`;
  if(!ids.length){html+=`<div class="empty"><b>O cardápio de hoje está vazio</b>Escolha os produtos do dia para eles aparecerem aqui.<div style="margin-top:12px"><a class="btn primary" href="#cardapio">Montar cardápio</a></div></div>`}
  else{
    byCat(ids.map(id=>S.products[id])).forEach(([cat,arr])=>{
      html+=`<div class="cat-title"><h3>${esc(cat)}</h3></div><div class="cards">`;
      arr.forEach(p=>{const inCart=S.cart[p.pid]||0;const st=stockState(p);const left=p.stockQty!=null?p.stockQty-inCart:null;
        const alertAt=p.alertAt??S.settings.dailyAlert;const sold=soldToday(p.pid);
        let badge="";if(st==="bad")badge=`<span class="pill bad badge">Esgotado</span>`;else if(st==="warn"||(alertAt&&sold>=alertAt))badge=`<span class="pill warn badge">Últimas unidades</span>`;
        html+=`<button class="pcard" data-act="add" data-id="${p.pid}" ${!S.canWrite||(left!=null&&left<=0)?"disabled":""}><div class="ph">${p.imageUrl?imgTag(p):initial(p.name)}</div>${badge}${inCart?`<span class="qty num">${inCart}</span>`:""}<div class="tx"><b>${esc(p.name)}</b><span class="num">${brl(priceFor(p,ch))}</span>${p.stockQty!=null?`<span class="muted num" style="font-size:12px">${p.stockQty} em estoque</span>`:""}</div></button>`});
      html+=`</div>`});
  }
  const recent=[...S.todayOrders].sort((a,b)=>b.ts-a.ts).slice(0,5);
  html+=`<div class="row" style="justify-content:space-between;margin:24px 0 10px"><h3 style="font-size:22px">Últimas comandas</h3><a class="btn small" href="#dia">Ver caixa do dia</a></div>`;
  html+=recent.length?`<div class="list" style="gap:10px">${recent.map(o=>orderCard(o,true)).join("")}</div>`:`<p class="muted">Nenhuma comanda fechada hoje.</p>`;
  return html;
};
function cartItems(){return Object.entries(S.cart).filter(([k,q])=>q>0&&S.products[k]).map(([k,q])=>({p:S.products[k],q}))}
function cartTotal(){return cartItems().reduce((a,{p,q})=>a+q*priceFor(p,S.channel),0)}
function renderCart(){
  const bar=$("#cartbar");const items=cartItems();
  if(view()!=="pdv"||!items.length){bar.hidden=true;return}
  const units=items.reduce((a,x)=>a+x.q,0);
  bar.hidden=false;
  bar.innerHTML=`<div class="wrap"><div class="cartbox"><div><div style="font-size:12px;opacity:.75">Comanda #${nextNo()} · ${CH[S.channel].label} · ${units} item${units===1?"":"s"}</div><div class="t num">${brl(cartTotal())}</div></div><div class="row"><button class="btn small" data-act="cartclear">Limpar</button><button class="btn primary" data-act="openpay">Fechar comanda</button></div></div></div>`;
}
function openPay(){
  if(S.channel!=="balcao"&&!["app","pix","credito","debito","dinheiro","outro"].includes(S.pay))S.pay="app";
  const items=cartItems();if(!items.length)return;const tot=cartTotal();
  const pays=S.channel==="balcao"?["pix","credito","debito","dinheiro","outro"]:["app","pix","dinheiro","outro"];
  if(!pays.includes(S.pay))S.pay=pays[0];
  const rec=num(S.received);const troco=S.pay==="dinheiro"&&rec!=null?rec-tot:null;
  const sh=$("#sheet");sh.hidden=false;
  sh.innerHTML=`<div class="sheet-bg" data-act="closebg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="payT">
  <div class="row" style="justify-content:space-between"><h2 id="payT" style="margin:0">Comanda <span class="num">#${nextNo()}</span></h2><span class="pill ${CH[S.channel].cls}">${CH[S.channel].label}</span></div>
  <div class="list" style="margin:12px 0">${items.map(({p,q})=>`<div class="li"><div class="grow"><div class="name">${esc(p.name)}</div><div class="muted num" style="font-size:13px">${brl(priceFor(p,S.channel))} cada</div></div><span class="qtyctl"><button data-act="cq" data-id="${p.pid}" data-d="-1" aria-label="Menos">−</button><b class="num">${q}</b><button data-act="cq" data-id="${p.pid}" data-d="1" aria-label="Mais">+</button></span><b class="num" style="width:88px;text-align:right">${brl(q*priceFor(p,S.channel))}</b></div>`).join("")}</div>
  <div class="row" style="justify-content:space-between;margin-bottom:14px"><span class="eyebrow">Total</span><span class="num" style="font-family:var(--display);font-size:32px;font-weight:700">${brl(tot)}</span></div>
  <div class="eyebrow" style="margin-bottom:8px">Forma de pagamento</div>
  <div class="paygrid">${pays.map(k=>`<button class="paybtn ${S.pay===k?"on":""}" data-act="pay" data-k="${k}">${PAY[k]}</button>`).join("")}</div>
  ${S.pay==="dinheiro"?`<div class="row" style="margin-top:12px;flex-wrap:nowrap"><label class="f" style="flex:1"><span>Valor recebido</span><input type="number" step="0.01" min="0" id="recv" value="${esc(S.received)}" placeholder="0,00"></label><div style="flex:1;text-align:right"><div class="eyebrow">Troco</div><div class="num" id="troco" style="font-size:22px;font-weight:600">${troco==null?"—":troco<0?"Falta "+brl(-troco):brl(troco)}</div></div></div>`:""}
  <label class="f" style="margin-top:12px"><span>Observação (nome do cliente, nº do pedido no app…)</span><input type="text" id="onote" value="${esc(S.note)}"></label>
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-act="closesheet">Voltar</button><button class="btn primary" data-act="checkout" id="checkoutBtn" ${S.canWrite?"":"disabled"}>Confirmar ${brl(tot)}</button></div>
  </div></div>`;
  const r=$("#recv");if(r)r.addEventListener("input",e=>{S.received=e.target.value;const v=num(S.received);const t=v==null?null:v-cartTotal();$("#troco").textContent=t==null?"—":t<0?"Falta "+brl(-t):brl(t)});
  const n=$("#onote");n.addEventListener("input",e=>S.note=e.target.value);
}
async function checkout(){
  const items=cartItems();if(!items.length)return;
  const btn=$("#checkoutBtn");if(btn){btn.disabled=true;btn.textContent="Registrando…"}
  const ts=Date.now();const ch=S.channel;
  const lines=items.map(({p,q})=>({productId:p.pid,name:p.name,category:p.category||"",qty:q,unitPrice:priceFor(p,ch),unitCost:p.costPrice??0}));
  const order={date:S.T,ts,number:nextNo(),channel:ch,payment:S.pay,items:lines,total:lines.reduce((a,l)=>a+l.qty*l.unitPrice,0),cost:lines.reduce((a,l)=>a+l.qty*l.unitCost,0),note:(S.note||"").trim(),by:S.user?.email||""};
  if(S.pay==="dinheiro"&&num(S.received)!=null)order.received=num(S.received);
  try{
    await S.db.doc("orders/o"+ts).set(order);
    for(const {p,q} of items){if(p.stockQty!=null)await S.db.doc("products/"+p.pid).update({stockQty:p.stockQty-q})}
    S.cart={};S.received="";S.note="";closeSheet();toast("Comanda #"+order.number+" registrada");
  }catch(e){toast(saveErr(e));if(btn){btn.disabled=false;btn.textContent="Confirmar"}}
  render();
}
async function deleteSale(oid){
  const o=S.todayOrders.find(x=>x.oid===oid)||(S.periodOrders||[]).find(x=>x.oid===oid);if(!o)return;
  try{await S.db.doc("orders/"+oid).delete();for(const i of o.items||[]){const p=S.products[i.productId];if(p&&p.stockQty!=null)await S.db.doc("products/"+p.pid).update({stockQty:p.stockQty+i.qty})}toast("Comanda #"+o.number+" cancelada")}catch(e){toast(saveErr(e))}
  S.confirmSale=null;render();
}
function saveErr(e){const c=e&&e.code;if(c==="permission-denied")return"Sem permissão para salvar.";if(c==="quota_exceeded"||c==="resource-exhausted")return"Limite gratuito do dia atingido. Tente amanhã.";return"Não foi possível salvar agora. Tente de novo."}
function breakdown(orders){const pay={},ch={};orders.forEach(o=>{pay[o.payment]=(pay[o.payment]||0)+o.total;ch[o.channel]=ch[o.channel]||{n:0,v:0};ch[o.channel].n++;ch[o.channel].v+=o.total});return{pay,ch}}
function breakdownHTML(orders){const {pay,ch}=breakdown(orders);const tot=orders.reduce((a,o)=>a+o.total,0)||1;
  const bars=(obj,lab)=>Object.entries(obj).sort((a,b)=>(b[1].v??b[1])-(a[1].v??a[1])).map(([k,v])=>{const val=v.v??v;return `<div class="row" style="flex-wrap:nowrap;margin:6px 0"><span style="width:110px">${esc(lab(k))}${v.n!=null?` <span class="muted num">(${v.n})</span>`:""}</span><div class="bar" style="flex:1"><i style="width:${(val/tot*100).toFixed(1)}%"></i></div><span class="num" style="width:96px;text-align:right">${brl(val)}</span></div>`}).join("");
  return `<div class="two"><div class="panel"><h3>Por forma de pagamento</h3>${bars(pay,k=>PAY[k]||k)||'<p class="muted">—</p>'}</div><div class="panel"><h3>Por canal</h3>${bars(ch,k=>(CH[k]||{label:k}).label)||'<p class="muted">—</p>'}</div></div>`}

  let html=`<div class="view-head"><div><div class="eyebrow">${esc(longDate(S.T))}</div><h2>Caixa do dia</h2></div><a class="btn" href="#fechamento">Ver outros dias</a></div>
  <div class="grid-kpi"><div class="kpi hero"><div class="l">Total do dia</div><div class="v num">${brl(s.rev)}</div><div class="h">${n} comanda${n===1?"":"s"}</div></div>
  <div class="kpi"><div class="l">Ticket médio</div><div class="v num">${brl(n?s.rev/n:0)}</div><div class="h">por comanda</div></div>
  <div class="kpi"><div class="l">Lucro bruto</div><div class="v num">${brl(s.profit)}</div><div class="h">margem ${pct(s.rev?s.margin:null)}</div></div>
  <div class="kpi"><div class="l">Em dinheiro</div><div class="v num">${brl(breakdown(os).pay.dinheiro||0)}</div><div class="h">para conferir na gaveta</div></div></div>`;

/* ---------- CARDÁPIO ---------- */
async function ensureMenuLoaded(){
  if(S.menuLoadedFor===S.menuDate)return;S.menuLoadedFor=S.menuDate;
  if(S.menuDate===S.T){S.menuSel=new Set(S.todayMenu);S.menuDirty=false;render();return}
  S.menuSel=null;
  try{const d=await S.db.doc("menus/"+S.menuDate).get();if(S.menuLoadedFor!==S.menuDate)return;S.menuSel=new Set(d.exists?(d.data().productIds||[]):[]);S.menuDirty=false}catch(e){S.menuSel=new Set()}
  render();
}
R.cardapio=()=>{
  const sel=S.menuSel;const actives=plist().filter(p=>p.active!==false);
  let html=`<div class="view-head"><div><div class="eyebrow">Monte o que vai para o balcão</div><h2>Cardápio do dia</h2></div></div>
  <div class="datebar"><button class="btn" data-act="mday" data-d="-1" aria-label="Dia anterior">‹</button><div class="c"><div class="eyebrow">Data do cardápio</div><b>${esc(longDate(S.menuDate))}</b>${S.menuDate===S.T?' <span class="pill ok">hoje</span>':""}</div><button class="btn" data-act="mday" data-d="1" aria-label="Próximo dia">›</button></div>`;
  if(!sel)return html+`<div class="empty"><b>Carregando cardápio</b></div>`;
  html+=`<div class="row" style="margin-bottom:6px"><span class="pill neutral num">${sel.size} selecionado${sel.size===1?"":"s"}</span><span style="flex:1"></span><button class="btn small" data-act="mall">Todos</button><button class="btn small" data-act="mnone">Limpar</button><button class="btn small" data-act="myest">Repetir dia anterior</button><button class="btn small primary" data-act="msave" ${!S.canWrite||!S.menuDirty?"disabled":""}>${S.menuDirty?"Salvar cardápio":"Salvo"}</button></div>`;
  byCat(actives).forEach(([cat,arr])=>{const n=arr.filter(p=>sel.has(p.pid)).length;
    html+=`<div class="cat-title"><h3>${esc(cat)}</h3><span class="muted num">${n}/${arr.length}</span><span style="flex:1"></span><button class="chip" data-act="mcat" data-cat="${esc(cat)}">${n===arr.length?"Tirar todos":"Marcar todos"}</button></div><div class="cards">`;
    arr.forEach(p=>{const on=sel.has(p.pid);html+=`<button class="pcard ${on?"sel":""}" data-act="mtoggle" data-id="${p.pid}" aria-pressed="${on}"><div class="ph">${p.imageUrl?imgTag(p):initial(p.name)}</div><span class="check">${on?"✓":""}</span><div class="tx"><b>${esc(p.name)}</b><span class="num">${brl(p.price)}</span></div></button>`});
    html+=`</div>`});
  if(!actives.length)html+=`<div class="empty"><b>Nenhum produto ativo</b>Cadastre produtos no Catálogo.</div>`;
  return html;
};
async function saveMenu(){
  const ids=[...S.menuSel];try{await S.db.doc("menus/"+S.menuDate).set({date:S.menuDate,productIds:ids,updatedAt:Date.now()});S.menuDirty=false;toast("Cardápio salvo")}catch(e){toast(saveErr(e))}render();
}
async function copyPrevMenu(){
  let d=addDays(S.menuDate,-1);for(let i=0;i<14;i++){try{const s=await S.db.doc("menus/"+d).get();if(s.exists&&(s.data().productIds||[]).length){S.menuSel=new Set(s.data().productIds.filter(id=>S.products[id]));S.menuDirty=true;toast("Copiado de "+shortDate(d));render();return}}catch(e){}d=addDays(d,-1)}
  toast("Nenhum cardápio nos últimos 14 dias");
}

/* ---------- CATÁLOGO ---------- */
R.catalogo=()=>{
  const all=plist();const cats=catOrder();
  const band=p=>{const m=margin(p);if(m==null)return"none";if(m>=.5)return"hi";if(m>=.3)return"mid";return"lo"};
  const cnt={hi:0,mid:0,lo:0,none:0};all.forEach(p=>cnt[band(p)]++);
  const q=S.q.trim().toLowerCase();
  const list=all.filter(p=>(!S.cat||p.category===S.cat)&&(!S.mf||band(p)===S.mf)&&(!q||(p.name||"").toLowerCase().includes(q)));

function shrink(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const s=Math.min(1,420/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);let u=c.toDataURL("image/webp",.75);if(!u.startsWith("data:image/webp"))u=c.toDataURL("image/jpeg",.78);res(u)};img.onerror=rej;img.src=URL.createObjectURL(file)})}

async function saveStock(){
  const keys=Object.keys(S.stockDraft).filter(k=>S.stockDraft[k]!==""&&S.products[k]);
  try{for(const k of keys){const p=S.products[k];const v=num(S.stockDraft[k]);if(v==null)continue;const after=S.stockMode==="set"?v:p.stockQty+v;
    await S.db.doc("products/"+k).update({stockQty:after,stockLog:[{ts:Date.now(),type:S.stockMode==="set"?"contagem":"reposição",before:p.stockQty,after},...(p.stockLog||[])].slice(0,30)})}
    S.stockDraft={};toast("Estoque atualizado")}catch(e){toast(saveErr(e))}
  render();
}

function presetRange(k){const t=S.T;if(k==="hoje")return[t,t];if(k==="ontem"){const y=addDays(t,-1);return[y,y]}if(k==="7d")return[addDays(t,-6),t];if(k==="mes")return[t.slice(0,8)+"01",t];if(k==="mespassado"){const d=parseD(t);const a=new Date(d.getFullYear(),d.getMonth()-1,1),b=new Date(d.getFullYear(),d.getMonth(),0);return[dstr(a),dstr(b)]}return[S.period.from,S.period.to]}
async function ensurePeriod(force){
  const {from,to}=S.period;const key=from+"|"+to;
  if(from===S.T&&to===S.T){S.periodSales=S.todaySales;S.periodOrders=S.todayOrders;S.periodKey=key;return}
  if(!force&&S.periodKey===key)return;S.periodKey=key;S.periodSales=null;
  try{const snap=await S.db.collection("orders").where("date",">=",from).where("date","<=",to).limit(2000).get();if(S.periodKey!==key)return;S.periodOrders=snap.docs.map(d=>({oid:d.id,...d.data()}));S.periodSales=linesOf(S.periodOrders)}catch(e){S.periodOrders=[];S.periodSales=[]}
  render();
}
R.fechamento=()=>{
  const P=S.period;const presets=[["hoje","Hoje"],["ontem","Ontem"],["7d","7 dias"],["mes","Este mês"],["mespassado","Mês passado"]];
  let html=`<div class="view-head"><div><div class="eyebrow">${P.from===P.to?esc(longDate(P.from)):esc(shortDate(P.from))+" a "+esc(shortDate(P.to))}</div><h2>Fechamento</h2></div><button class="btn" data-act="share">Copiar resumo</button></div>
  <div class="row" style="margin-bottom:12px">${presets.map(([k,l])=>`<button class="chip ${P.preset===k?"on":""}" data-act="preset" data-k="${k}">${l}</button>`).join("")}<span class="row" style="gap:6px"><input type="date" id="pfrom" value="${P.from}" style="width:auto" aria-label="De"><span class="muted">até</span><input type="date" id="pto" value="${P.to}" style="width:auto" aria-label="Até"></span></div>`;
  const isToday=P.from===S.T&&P.to===S.T;const sales=isToday?S.todaySales:S.periodSales;
  if(!sales)return html+`<div class="empty"><b>Calculando o período</b></div>`;
  const s=summarize(sales);
  html+=`<div class="grid-kpi"><div class="kpi hero"><div class="l">Faturamento</div><div class="v num">${brl(s.rev)}</div></div><div class="kpi"><div class="l">Custo total</div><div class="v num">${brl(s.cost)}</div></div><div class="kpi"><div class="l">Lucro bruto</div><div class="v num">${brl(s.profit)}</div></div><div class="kpi"><div class="l">Margem</div><div class="v num">${pct(s.rev?s.margin:null)}</div></div><div class="kpi"><div class="l">Unidades</div><div class="v num">${s.units}</div></div></div>`;
  if(!sales.length)return html+`<div class="empty"><b>Nenhuma venda no período</b>As vendas registradas no PDV aparecem aqui.</div>`;
  html+=breakdownHTML(isToday?S.todayOrders:(S.periodOrders||[]));
  const days={};sales.forEach(x=>{days[x.date]=(days[x.date]||0)+x.qty*x.unitPrice});const dk=Object.keys(days).sort();
  if(dk.length>1){const mx=Math.max(...Object.values(days));html+=`<div class="panel"><h3>Por dia</h3>${dk.map(d=>`<div class="row" style="flex-wrap:nowrap;margin:6px 0"><span class="num muted" style="width:52px">${shortDate(d)}</span><div class="bar" style="flex:1"><i style="width:${(days[d]/mx*100).toFixed(1)}%"></i></div><span class="num" style="width:96px;text-align:right">${brl(days[d])}</span></div>`).join("")}</div>`}
  html+=`<div class="panel"><h3>Resumo por produto</h3><div class="tbl"><table><thead><tr><th>Produto</th><th class="r">Un.</th><th class="r">Receita</th><th class="r">Custo</th><th class="r">Lucro</th></tr></thead><tbody>${s.rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="r num">${r.qty}</td><td class="r num">${brl(r.rev)}</td><td class="r num">${brl(r.cost)}</td><td class="r num">${brl(r.rev-r.cost)}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="panel"><h3>Comandas do período</h3><div class="tbl"><table><thead><tr><th>Data</th><th>Hora</th><th>Comanda</th><th>Canal</th><th>Pagamento</th><th>Itens</th><th class="r">Total</th></tr></thead><tbody>${[...(isToday?S.todayOrders:(S.periodOrders||[]))].sort((a,b)=>b.ts-a.ts).map(o=>`<tr><td class="num">${shortDate(o.date)}</td><td class="num">${hm(o.ts)}</td><td class="num">#${o.number}</td><td>${(CH[o.channel]||{label:o.channel}).label}</td><td>${esc(PAY[o.payment]||o.payment)}</td><td style="white-space:normal;min-width:180px">${(o.items||[]).map(i=>i.qty+"× "+esc(i.name)).join(", ")}</td><td class="r num">${brl(o.total)}</td></tr>`).join("")}</tbody></table></div></div>`;
  return html;
};
function summaryText(){const P=S.period;const isT=P.from===S.T&&P.to===S.T;const sales=isT?S.todaySales:(S.periodSales||[]);const os=isT?S.todayOrders:(S.periodOrders||[]);const s=summarize(sales);const bd=breakdown(os);

  try{
  if(k==="vendas"){const per=$("#xper").value;const rows=await allSales(per);await save(`vendas-${per}-${S.T}.csv`,csv([["Data","Hora","Comanda","Canal","Pagamento","Produto","Categoria","Quantidade","Preço unit.","Custo unit.","Total","Custo total","Lucro"],...rows.map(x=>[x.date,hm(x.ts),x.orderNo,(CH[x.channel]||{label:x.channel}).label,PAY[x.payment]||x.payment,x.name,x.category||"",x.qty,dec(x.unitPrice),dec(x.unitCost),dec(x.qty*x.unitPrice),dec(x.qty*(x.unitCost||0)),dec(x.qty*(x.unitPrice-(x.unitCost||0)))])]))}
  if(k==="fech"){const per=$("#xper2").value;const rows=await allSales(per);const g={};rows.forEach(x=>{(g[x.date]=g[x.date]||[]).push(x)});await save(`fechamentos-${per}-${S.T}.csv`,csv([["Data","Unidades","Faturamento","Custo","Lucro bruto","Margem %"],...Object.keys(g).sort().map(d=>{const s=summarize(g[d]);return[d,s.units,dec(s.rev),dec(s.cost),dec(s.profit),dec(s.margin*100)]})]))}
  if(k==="cat"){await save(`catalogo-${S.T}.csv`,csv([["ID","Produto","Categoria","Preço balcão","Preço iFood","Preço 99Food","Custo","Margem %","Ativo","Destaque","Pedido mínimo","Ingredientes","Alérgenos","Descrição"],...plist().sort((a,b)=>a.id-b.id).map(p=>[p.id,p.name,p.category,dec(p.price),dec(p.priceIfood),dec(p.price99),dec(p.costPrice),margin(p)==null?"":dec(margin(p)*100),p.active!==false?"sim":"não",p.featured?"sim":"não",p.minQuantity??"",p.ingredients||"",p.allergens||"",p.description||""])]))}
  if(k==="est"){await save(`estoque-${S.T}.csv`,csv([["Produto","Categoria","Em estoque","Mínimo","Situação"],...plist().filter(p=>p.stockQty!=null).map(p=>[p.name,p.category,p.stockQty,p.minStockQty??"",{ok:"OK",warn:"Baixo",bad:"Esgotado"}[stockState(p)]])]))}
  if(k==="bak"){const orders=await allOrders("tudo");const menus=(await S.db.collection("menus").limit(1000).get()).docs.map(d=>({id:d.id,...d.data()}));await save(`backup-brige-${S.T}.json`,JSON.stringify({app:"brige-gestao",version:1,exportedAt:new Date().toISOString(),settings:S.settings,products:plist(),menus,orders},null,1))}
  }catch(e){toast("Não foi possível gerar o arquivo.")}
}
async function restore(file){
  try{const data=JSON.parse(await file.text());if(data.app!=="brige-gestao")throw 0;let n=0;
    for(const p of data.products||[]){const {pid,...b}=p;await S.db.doc("products/"+(pid||"p"+b.id)).set(b);n++}
    for(const m of data.menus||[]){const {id,...b}=m;await S.db.doc("menus/"+id).set(b);n++}
    for(const o of data.orders||[]){const {oid,...b}=o;await S.db.doc("orders/"+oid).set(b);n++}
    if(data.settings)await S.db.doc("settings/main").set(data.settings);
    toast(n+" registros restaurados")}catch(e){toast("Arquivo de backup inválido.")}
}

/* ---------- AJUSTES ---------- */
R.ajustes=()=>{const st=S.settings;return `<div class="view-head"><div><div class="eyebrow">Valem para todos que usam o sistema</div><h2>Ajustes</h2></div></div>
  <form id="setform" class="panel form">
    <label class="f full"><span>Nome da loja</span><input type="text" id="s_name" value="${esc(st.storeName||"")}"></label>
    <label class="f"><span>WhatsApp da loja</span><input type="text" id="s_wa" value="${esc(st.whatsappNumber||"")}"></label>
    <label class="f"><span>Horário de funcionamento</span><input type="text" id="s_hours" value="${esc(st.openingHours||"")}"></label>
    <label class="f"><span>Estoque mínimo padrão</span><input type="number" min="0" step="1" id="s_low" value="${st.lowStockThreshold??""}" placeholder="3"><span style="font-size:12px">Usado quando o produto não tem mínimo próprio.</span></label>
    <label class="f"><span>Aviso "últimas unidades" após vender (padrão)</span><input type="number" min="0" step="1" id="s_alert" value="${st.dailyAlert??""}" placeholder="desligado"><span style="font-size:12px">O PDV mostra o aviso quando um produto atingir esse número de vendas no dia.</span></label>
    <div class="row full" style="justify-content:flex-end"><button class="btn primary" type="submit" ${S.canWrite?"":"disabled"}>Salvar ajustes</button></div>
  </form>
  <div class="panel"><h3>Planilhas e backup</h3><p class="muted">Baixe vendas, catálogo, estoque e o backup completo.</p><a class="btn primary" href="#exportar">Abrir exportação</a></div>
  <div class="panel"><h3>Quem pode usar</h3><p class="muted">Cada pessoa entra com o próprio e-mail e senha. Para dar acesso a alguém novo, peça ao responsável técnico para cadastrar o e-mail. Você está conectado como <b id="whoami"></b>.</p></div>`};
async function saveSettings(e){e.preventDefault();const b={...S.settings,storeName:$("#s_name").value.trim()||"Brigé",whatsappNumber:$("#s_wa").value.trim(),openingHours:$("#s_hours").value.trim(),lowStockThreshold:num($("#s_low").value),dailyAlert:num($("#s_alert").value)};try{await S.db.doc("settings/main").set(b);toast("Ajustes salvos")}catch(err){toast(saveErr(err))}}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,id=t.dataset.id;
  if(a==="closebg"&&e.target!==t)return;
  switch(a){
    case"add":{const p=S.products[id];const inCart=S.cart[id]||0;if(p.stockQty!=null&&inCart>=p.stockQty){toast("Sem estoque suficiente");return}S.cart[id]=inCart+1;render();break}
    case"cartclear":S.cart={};S.received="";S.note="";render();break;
    case"chan":if(S.channel!==t.dataset.k){S.channel=t.dataset.k;S.pay=S.channel==="balcao"?"pix":"app"}render();break;
    case"openpay":openPay();break;
    case"pay":S.pay=t.dataset.k;openPay();break;
    case"cq":{const p=S.products[id];const nq=(S.cart[id]||0)+(+t.dataset.d);if(p.stockQty!=null&&nq>p.stockQty){toast("Sem estoque suficiente");return}if(nq<=0)delete S.cart[id];else S.cart[id]=nq;if(!cartItems().length){closeSheet();render()}else{openPay();renderCart()}break}
    case"checkout":checkout();break;
    case"askdel":S.confirmSale=id;render();break;
    case"nodel":S.confirmSale=null;render();break;
    case"delsale":deleteSale(id);break;
    case"mday":S.menuDate=addDays(S.menuDate,+t.dataset.d);S.menuLoadedFor=null;render();break;
    case"mtoggle":S.menuSel.has(id)?S.menuSel.delete(id):S.menuSel.add(id);S.menuDirty=true;render();break;
    case"mall":plist().filter(p=>p.active!==false).forEach(p=>S.menuSel.add(p.pid));S.menuDirty=true;render();break;
    case"mnone":S.menuSel.clear();S.menuDirty=true;render();break;
    case"mcat":{const arr=plist().filter(p=>p.active!==false&&p.category===t.dataset.cat);const all=arr.every(p=>S.menuSel.has(p.pid));arr.forEach(p=>all?S.menuSel.delete(p.pid):S.menuSel.add(p.pid));S.menuDirty=true;render();break}
    case"myest":copyPrevMenu();break;
    case"msave":saveMenu();break;
    case"mf":S.mf=S.mf===t.dataset.k?"":t.dataset.k;render();break;
    case"newp":openEditor(null);break;
    case"editp":openEditor(id);break;
    case"closesheet":case"closebg":closeSheet();break;
    case"rmphoto":$("#f_img").value="";$("#phPrev").innerHTML=`<div class="thumb">${initial($("#f_name").value)}</div>`;t.remove();break;
    case"askdelp":$("#delZone").innerHTML=`<span class="muted" style="font-size:13px">Excluir de vez?</span> <button type="button" class="btn small danger" data-act="delp">Sim, excluir</button>`;break;
    case"delp":deleteProduct($("#pform").dataset.id);break;
    case"smode":S.stockMode=t.dataset.m;S.stockDraft={};render();break;
    case"hist":S.openHist[id]=!S.openHist[id];render();break;
    case"ssave":saveStock();break;
    case"preset":{const [f,to]=presetRange(t.dataset.k);S.period={preset:t.dataset.k,from:f,to};render();break}
    case"share":{const txt=summaryText();navigator.clipboard.writeText(txt).then(()=>toast("Resumo copiado. Cole no WhatsApp."),()=>{toast("Não foi possível copiar.")});break}
    case"x":doExport(t.dataset.k);break;
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("#q");q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}
  if(e.target.classList.contains("sd")){S.stockDraft[e.target.dataset.id]=e.target.value;const pend=Object.keys(S.stockDraft).filter(k=>S.stockDraft[k]!=="").length;const b=document.querySelector('[data-act="ssave"]');if(b){b.disabled=!S.canWrite||!pend;b.textContent="Salvar "+(pend?pend+" alteraç"+(pend===1?"ão":"ões"):"tudo")}}
});
document.addEventListener("change",e=>{
  if(e.target.id==="catf"){S.cat=e.target.value;render()}
  if(e.target.id==="pfrom"||e.target.id==="pto"){let f=$("#pfrom").value,to=$("#pto").value;if(f&&to){if(f>to)[f,to]=[to,f];S.period={preset:"custom",from:f,to};render()}}
  if(e.target.id==="restoreFile"&&e.target.files[0])restore(e.target.files[0]);
});
document.addEventListener("submit",e=>{if(e.target.id==="setform")saveSettings(e)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet()});
window.addEventListener("hashchange",()=>{window.scrollTo(0,0);lsSet("brige:view",view());render()});

/* ---------- boot ---------- */
let unsubToday=[];
function subToday(){
  unsubToday.forEach(u=>u());S.T=today();
  unsubToday=[
    S.db.collection("orders").where("date","==",S.T).onSnapshot(s=>{S.todayOrders=s.docs.map(d=>({oid:d.id,...d.data()}));S.todaySales=linesOf(S.todayOrders);if(S.period.from===S.T&&S.period.to===S.T){S.periodSales=S.todaySales;S.periodOrders=S.todayOrders}render()},()=>{}),
    S.db.doc("menus/"+S.T).onSnapshot(d=>{S.todayMenu=d.exists?(d.data().productIds||[]):[];if(S.menuDate===S.T&&!S.menuDirty){S.menuSel=new Set(S.todayMenu);S.menuLoadedFor=S.T}render()},()=>{})
  ];
}
function renderLogin(){
  $("#tabs").innerHTML="";$("#status").textContent="";$("#logout").hidden=true;
  $("#app").innerHTML=`<form class="login panel" id="loginForm"><h2 style="font-size:28px">Entrar</h2><p class="muted" style="margin:0">Use o e-mail e a senha cadastrados para a sua equipe.</p>
  <label class="f"><span>E-mail</span><input type="email" id="l_email" autocomplete="username" required></label>
  <label class="f"><span>Senha</span><input type="password" id="l_pass" autocomplete="current-password" required></label>
  <div class="err" id="l_err"></div><button class="btn primary" type="submit" id="l_btn">Entrar</button>
  <button type="button" class="linkbtn" id="l_reset">Esqueci minha senha</button></form>`;
  $("#loginForm").addEventListener("submit",async e=>{e.preventDefault();$("#l_err").textContent="";$("#l_btn").disabled=true;$("#l_btn").textContent="Entrando…";
    try{await firebase.auth().signInWithEmailAndPassword($("#l_email").value.trim(),$("#l_pass").value)}catch(err){$("#l_err").textContent=/invalid|wrong|user-not-found|credential/.test(err.code||"")?"E-mail ou senha incorretos.":err.code==="auth/too-many-requests"?"Muitas tentativas. Aguarde alguns minutos.":"Não foi possível entrar. Verifique a internet.";$("#l_btn").disabled=false;$("#l_btn").textContent="Entrar"}});
  $("#l_reset").addEventListener("click",async()=>{const em=$("#l_email").value.trim();if(!em){$("#l_err").textContent="Digite seu e-mail acima e clique de novo.";return}try{await firebase.auth().sendPasswordResetEmail(em);$("#l_err").textContent="";toast("Enviamos um link para redefinir a senha.")}catch(e){$("#l_err").textContent="Não foi possível enviar o e-mail."}});
}
let started=false;
function startData(){
  if(started)return;started=true;const db=S.db;
  const slow=setTimeout(()=>{if(!S.loaded){$("#status").textContent="Conexão lenta…"}},10000);
  db.collection("products").onSnapshot({includeMetadataChanges:true},s=>{clearTimeout(slow);const m={};s.docs.forEach(d=>{m[d.id]={pid:d.id,...d.data()}});S.products=m;S.loaded=true;$("#status").textContent=s.metadata.fromCache?"Offline · salva ao reconectar":"Sincronizado";render()},e=>{clearTimeout(slow);S.loaded=true;$("#status").textContent=e.code==="permission-denied"?"Sem acesso":"Sem conexão";if(e.code==="permission-denied")S.canWrite=false;render()});
  db.doc("settings/main").onSnapshot(d=>{S.settings=d.exists?d.data():{};render()},()=>{});
  subToday();
  setInterval(()=>{if(today()!==S.T){S.cart={};S.period={preset:"hoje",from:today(),to:today()};S.menuDate=today();S.menuLoadedFor=null;subToday()}},60000);
}
async function boot(){
  if(!location.hash){const v=lsGet("brige:view",null);if(v)history.replaceState(null,"","#"+v)}
  if(!window.firebase){$("#app").innerHTML=`<div class="empty"><b>Sem conexão</b>Não foi possível carregar o sistema. Verifique a internet e recarregue a página.</div>`;return}
  firebase.initializeApp(FIREBASE_CONFIG);
  const db=firebase.firestore();
  try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
  S.db=db;
  $("#logout").addEventListener("click",()=>firebase.auth().signOut().then(()=>location.reload()));
  firebase.auth().onAuthStateChanged(u=>{S.user=u;if(u){$("#logout").hidden=false;startData();render();const w=$("#whoami");if(w)w.textContent=u.email}else{render()}});
}
window.brigeImport=async function(data){const db=firebase.firestore();let n=0;for(const p of data.products||[]){const {pid,...b}=p;await db.doc("products/"+(pid||"p"+b.id)).set(b);n++}if(data.settings)await db.doc("settings/main").set(data.settings);return n};
boot();
})();
</script>
